<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#02685D" />
    <meta name="description" content="Multisoluciones — Plataforma de seguimiento y gestión de comerciales" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css">
    <title>Multisoluciones — Seguimiento de Comerciales</title>
    <style>
      .loader {
        position: fixed; top: calc(50% - 25px); left: calc(50% - 25px);
        width: 50px; aspect-ratio: 1; box-sizing: content-box; animation: ms-spin 1s infinite linear;
        border-radius: 50%; border: 8px solid rgba(2, 104, 93, 0.18); border-right-color: #02685D;
      }
      @keyframes ms-spin {to{transform: rotate(1turn)}}
    </style>
  </head>
  <body>
    <noscript>Habilita JavaScript para usar la plataforma de seguimiento de comerciales Multisoluciones.</noscript>
    <div id="root" class="root"></div>
    <div class="loader"></div>
    <script type="module" src="/src/index.jsx" onerror="alert('Error al cargar la aplicación.')"></script>
  </body>
</html>
